name: Nix
# Release-only on purpose. The flake pins a vendorHash that has to match
# go.mod/go.sum exactly, and only `rake release` rewrites it (rakelib/dist.rake,
# update_flake). Running on every push meant every dependency bump between two
# releases left this workflow red until the next release, which is noise, not
# signal. `rake release` pushes the tag, so the build lands where the hash is
# guaranteed fresh; workflow_dispatch is there for checking a branch by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31

      # Verifies the published tag builds on Linux; rake release only ever
      # built it on the release machine.
      - name: Build glu via flake
        run: nix build

      - name: Sanity-check binary
        run: ./result/bin/glu --version
